<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гант-диаграмма</title>
<link rel="stylesheet" href="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.css">
<style>
/* ── CSS variables (light) ── */
:root {
  --bg:        #f0f2f8;
  --surface:   #ffffff;
  --surface2:  #f5f7fc;
  --border:    #e2e8f0;
  --border2:   #c8d4e8;
  --text:      #1a2033;
  --text2:     #4a5578;
  --text3:     #94a3b8;
  --accent:    #5b6ef5;
  --accentH:   #4353d8;
  --accentBg:  #eef0fd;
  --green:     #22c07a;
  --amber:     #f0a028;
  --red:       #ef4444;
  --purple:    #9b6ff5;
  --rs:        6px;
  --sh:        0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shm:       0 4px 16px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.04);

  /* dhtmlxGantt tokens (light) */
  --g-bg:          #ffffff;
  --g-bg2:         #f8fafc;
  --g-border:      #e2e8f0;
  --g-text:        #1e293b;
  --g-text2:       #64748b;
  --g-scale-bg:    #f8fafc;
  --g-row-odd:     #ffffff;
  --g-row-even:    #f8fafc;
  --g-row-hover:   #eef0fd;
  --g-link:        #94a3b8;
  --g-link-sel:    #5b6ef5;
  --g-today:       rgba(239,68,68,.15);
}

/* ── dark mode ── */
[data-dark] {
  --bg:        #0d1120;
  --surface:   #141928;
  --surface2:  #1a2035;
  --border:    #222d44;
  --border2:   #2c3a58;
  --text:      #dde4f5;
  --text2:     #7a8ab0;
  --text3:     #3e4e72;
  --accent:    #7080f8;
  --accentH:   #8f9fff;
  --accentBg:  #181e40;

  --g-bg:          #141928;
  --g-bg2:         #0d1120;
  --g-border:      #222d44;
  --g-text:        #dde4f5;
  --g-text2:       #7a8ab0;
  --g-scale-bg:    #0d1120;
  --g-row-odd:     #141928;
  --g-row-even:    #1a2035;
  --g-row-hover:   #1e2a50;
  --g-link:        #3e4e72;
  --g-link-sel:    #7080f8;
  --g-today:       rgba(112,128,248,.12);
}

/* ── dhtmlxGantt theme via CSS vars ── */
.gantt_container, .gantt_grid, .gantt_task { background: var(--g-bg) !important; }

/* Grid header */
.gantt_grid_head_cell {
  background: var(--g-scale-bg) !important;
  color: var(--g-text2) !important;
  border-color: var(--g-border) !important;
  font-size: 11px !important; font-weight: 600 !important;
  text-transform: uppercase; letter-spacing: .04em;
}
/* Grid cells */
.gantt_grid_data .gantt_cell {
  background: var(--g-bg) !important;
  color: var(--g-text) !important;
  border-color: var(--g-border) !important;
  font-size: 12px !important;
}
.gantt_row { background: var(--g-row-odd) !important; }
.gantt_row.odd { background: var(--g-row-even) !important; }
.gantt_row:hover .gantt_cell { background: var(--g-row-hover) !important; }

/* Timeline rows */
.gantt_task_row { background: var(--g-row-odd) !important; }
.gantt_task_row.odd { background: var(--g-row-even) !important; }

/* Scale */
.gantt_scale_line {
  background: var(--g-scale-bg) !important;
  color: var(--g-text2) !important;
  border-color: var(--g-border) !important;
  font-size: 11px !important;
}
.gantt_scale_cell { color: var(--g-text2) !important; border-color: var(--g-border) !important; }

/* Vertical lines */
.gantt_task_vscroll, .gantt_ver_scroll { border-color: var(--g-border) !important; }
.gantt_line_down, .gantt_line_up, .gantt_line_right { background: var(--g-border) !important; }

/* Today marker */
.gantt_today_line, .gantt_marker { background: var(--g-today) !important; border-color: #ef4444 !important; }

/* Task bars */
.gantt_task_line {
  border-radius: 5px !important;
  box-shadow: 0 1px 3px rgba(0,0,0,.15) !important;
  border: none !important;
}
.gantt_task_content {
  color: rgba(255,255,255,.95) !important;
  font-size: 11px !important; font-weight: 500 !important;
}
.gantt_task_progress { border-radius: 5px 0 0 5px !important; opacity: .35 !important; }

/* Links / arrows — only recolor, no size overrides (avoids corner artifacts) */
.gantt_link_line_right, .gantt_link_line_left,
.gantt_link_line_down,  .gantt_link_line_up,
.gantt_line_down, .gantt_line_up, .gantt_line_right {
  background: var(--accent) !important;
  opacity: .65;
}
.gantt_link_arrow_right, .gantt_link_arrow_left,
.gantt_link_arrow_down,  .gantt_link_arrow_up {
  border-color: var(--accent) !important;
  opacity: .75;
}
/* Hover — brighten whole link on row hover via JS class */
.gantt_link_selected .gantt_link_line_right,
.gantt_link_selected .gantt_link_line_left,
.gantt_link_selected .gantt_link_line_down,
.gantt_link_selected .gantt_link_line_up  {
  background: var(--g-link-sel) !important; opacity: 1 !important;
}
.gantt_link_selected .gantt_link_arrow_right,
.gantt_link_selected .gantt_link_arrow_left,
.gantt_link_selected .gantt_link_arrow_down,
.gantt_link_selected .gantt_link_arrow_up {
  border-color: var(--g-link-sel) !important; opacity: 1 !important;
}
/* Drag endpoint dots */
.gantt_link_point {
  background: var(--accent) !important;
  border-color: var(--accent) !important;
  border-radius: 50% !important;
}

/* Lightbox (task edit dialog) */
.gantt_cal_light {
  background: var(--surface) !important;
  border: 1px solid var(--border2) !important;
  border-radius: 12px !important;
  color: var(--text) !important;
  box-shadow: var(--shm) !important;
}
.gantt_cal_larea { background: var(--surface) !important; border-color: var(--border) !important; }
.gantt_cal_lsection { color: var(--text2) !important; font-size: 12px !important; }
.gantt_cal_light input, .gantt_cal_light select, .gantt_cal_light textarea {
  background: var(--surface2) !important; color: var(--text) !important;
  border: 1px solid var(--border2) !important; border-radius: var(--rs) !important;
}
.gantt_save_btn { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; border-radius: var(--rs) !important; }
.gantt_cancel_btn_set { background: var(--surface2) !important; color: var(--text2) !important; border-color: var(--border2) !important; border-radius: var(--rs) !important; }
.gantt_delete_btn_set { background: var(--red) !important; color: #fff !important; border-radius: var(--rs) !important; }
.gantt_cal_light_wide .gantt_cal_ltext { border-color: var(--border) !important; }
.gantt_popup_shadow { box-shadow: var(--shm) !important; }

/* Tooltip */
.gantt_tooltip {
  background: var(--surface) !important;
  border: 1px solid var(--border2) !important;
  border-radius: 8px !important;
  color: var(--text) !important;
  box-shadow: var(--shm) !important;
  font-size: 12px !important;
  padding: 8px 12px !important;
}

/* Resize handle */
.gantt_drag_full_id { background: var(--border) !important; }

/* Horizontal scrollbar */
.gantt_hor_scroll { height: 12px !important; background: var(--g-bg2) !important; border-top: 1px solid var(--g-border) !important; }
.gantt_scroll_x    { height: 12px !important; background: var(--g-bg2) !important; border-top: 1px solid var(--g-border) !important; }
/* Vertical scrollbar */
.gantt_ver_scroll, .gantt_scroll_y { width: 8px !important; }

/* Weekend & holiday column highlight */
.gantt-weekend-col { background: rgba(148,163,184,.09) !important; }
.gantt-holiday-col { background: rgba(239,68,68,.07)   !important; }
[data-dark] .gantt-weekend-col { background: rgba(148,163,184,.07) !important; }
[data-dark] .gantt-holiday-col { background: rgba(239,68,68,.06)   !important; }

/* ── App shell ── */
* { margin:0;padding:0;box-sizing:border-box; }
body {
  font-family: -apple-system,'Segoe UI',Roboto,sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  transition: background .2s, color .2s;
}

/* Header */
.hd {
  background: var(--surface); border-bottom: 1px solid var(--border);
  height: 52px; padding: 0 18px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  box-shadow: var(--sh);
}
.logo { width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0; }
.hd-title { font-size:15px;font-weight:600; }
.hd-sub   { font-size:10px;color:var(--text3);margin-top:1px; }
.spacer   { flex:1; }
.hd-right { display:flex;gap:6px;align-items:center; }

/* Scale tabs */
.vtabs { display:none;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:3px; }
.vtab  { padding:4px 10px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;color:var(--text2);border:none;background:transparent;transition:all .14s; }
.vtab.on { background:var(--accent);color:#fff; }
.vtab:hover:not(.on) { background:var(--border); }

/* Buttons */
.btn { display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--rs);font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .14s;white-space:nowrap;line-height:1; }
.btn:active { transform:scale(.97); }
.btn-icon { padding:6px 9px; }
.btn-ghost  { background:transparent;color:var(--text2);border-color:var(--border2); }
.btn-ghost:hover  { background:var(--surface2);color:var(--text); }
.btn-prime  { background:var(--accent);color:#fff; }
.btn-prime:hover  { background:var(--accentH); }
.btn-green  { background:var(--green);color:#fff; }
.btn-green:hover  { filter:brightness(.9); }
.btn-amber  { background:var(--amber);color:#fff; }
.btn-amber:hover  { filter:brightness(.9); }
.btn-purple { background:var(--purple);color:#fff; }
.btn-purple:hover { filter:brightness(.9); }

/* Controls */
.ctrl { background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden;transition:max-height .25s; }
.ctrl-in { padding:10px 18px;display:flex;flex-direction:column;gap:9px; }
.row  { display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end; }
.fg   { flex:1;min-width:120px; }
.fg label { display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px; }
input[type=text],input[type=date],input[type=file],select {
  width:100%;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--rs);font-size:12px;background:var(--surface);color:var(--text);transition:border-color .14s,box-shadow .14s;
}
input[type=file] { font-size:11px;cursor:pointer; }
input:hover,select:hover { border-color:var(--accent); }
input:focus,select:focus { outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,110,245,.15); }
#colSel { padding-top:9px;border-top:1px solid var(--border); }

/* Status bar */
.sbar { background:var(--surface2);border-bottom:1px solid var(--border);padding:5px 18px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex-shrink:0;min-height:34px; }
.chip { display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500; }
.cg  { background:var(--surface);border:1px solid var(--border);color:var(--text2); }
.cb  { background:var(--accentBg);color:var(--accent); }
.cgr { background:#ecfdf5;color:#065f46; }
.ca  { background:#fffbeb;color:#92400e; }
.cr  { background:#fef2f2;color:#991b1b; }
[data-dark] .cgr { background:#054030;color:#6ee7b7; }
[data-dark] .ca  { background:#42180a;color:#fcd34d; }
[data-dark] .cr  { background:#420a0a;color:#fca5a5; }
.vsep { width:1px;height:14px;background:var(--border2); }
.leg  { display:flex;flex-wrap:wrap;gap:6px; }
.li   { display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);padding:2px 8px 2px 6px;border-radius:20px;border:1px solid var(--border);background:var(--surface); }
.ld   { width:8px;height:8px;border-radius:50%;flex-shrink:0; }

/* Stat bar */
.stbar { display:none;flex-wrap:wrap;gap:7px;padding:7px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0; }
.sc   { background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:5px 13px;display:flex;flex-direction:column;gap:1px; }
.sc-l { font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500; }
.sc-v { font-size:14px;font-weight:600;color:var(--text); }
.sc-v.acc { color:var(--accent); }
.pw   { background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:5px 13px;display:flex;align-items:center;gap:9px; }
.pt   { width:88px;height:5px;background:var(--border2);border-radius:3px;overflow:hidden; }
.pf   { height:100%;background:var(--green);border-radius:3px;transition:width .3s; }
.pp   { font-size:12px;font-weight:600;color:var(--text2); }

/* Gantt wrapper */
.gwrap { flex:1;position:relative;min-height:0;overflow:hidden; }
#gantt_here { position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%; }

/* Sidebar toggle */
.sidebar-toggle {
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  z-index:100;display:none;width:22px;height:44px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:0 6px 6px 0;cursor:pointer;color:var(--text3);
  align-items:center;justify-content:center;font-size:10px;
  box-shadow:var(--sh);transition:all .15s;
}
.sidebar-toggle:hover { color:var(--accent);border-color:var(--accent);background:var(--accentBg); }

/* Modal */
.ov { position:fixed;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s; }
.ov.open { opacity:1;pointer-events:all; }
.modal { background:var(--surface);border-radius:14px;padding:22px;box-shadow:var(--shm);width:420px;max-width:92vw;transform:translateY(6px);transition:transform .2s; }
.ov.open .modal { transform:translateY(0); }
.mtitle { font-size:15px;font-weight:600;margin-bottom:15px;color:var(--text); }
.mr  { margin-bottom:11px; }
.mr label { font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:4px;display:block; }
.mr input,.mr select,.mr textarea {
  width:100%;padding:7px 10px;border:1px solid var(--border2);
  border-radius:6px;font-size:12px;background:var(--surface);color:var(--text);
}
.mr input:focus,.mr select:focus { outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,110,245,.15); }
.mflex { display:flex;gap:9px; }
.mflex .mr { flex:1; }
.mps { display:flex;align-items:center;gap:8px; }
.mps input[type=range] { flex:1; }
.mfoot { display:flex;gap:8px;justify-content:flex-end;margin-top:15px; }

/* Dep hint */
.dep-hint {
  font-size:11px;color:var(--text3);padding:5px 9px;
  background:var(--surface2);border-radius:var(--rs);
  border:1px solid var(--border); line-height:1.5;
}

::-webkit-scrollbar { width:6px;height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2);border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--text3); }
@media(max-width:680px) { .row { flex-direction:column; } .hd-title { font-size:13px; } .btn span { display:none; } }
</style>
</head>
<body>

<div class="hd">
  <div class="logo">📊</div>
  <div><div class="hd-title">Гант-диаграмма</div><div class="hd-sub">Управление проектами · перетащите стрелку для зависимости</div></div>
  <div class="spacer"></div>
  <div class="hd-right">
    <div class="vtabs" id="vtabs">
      <button class="vtab on"  data-scale="day">День</button>
      <button class="vtab"     data-scale="week">Нед</button>
      <button class="vtab"     data-scale="month">Мес</button>
    </div>
    <button class="btn btn-ghost btn-icon" id="themeBtn">🌙</button>
    <button class="btn btn-ghost btn-icon" id="ctrlBtn">⚙️</button>
    <button class="btn btn-ghost" id="addTaskBtn" style="display:none">＋ <span>Задача</span></button>
    <button class="btn btn-purple" id="saveBtn">💾 <span>Сохранить</span></button>
    <button class="btn btn-amber"  id="loadBtn">📂 <span>Загрузить</span></button>
    <input type="file" id="loadFile" accept=".gantt" style="display:none">
    <button class="btn btn-green"  id="fsBtn">🖥️ <span>Экран</span></button>
  </div>
</div>

<div class="ctrl" id="ctrl">
  <div class="ctrl-in">
    <div class="row">
      <div class="fg"><label>📁 CSV файл</label><input type="file" id="csvFile" accept=".csv"></div>
      <div class="fg"><label>📅 Дата старта</label><input type="date" id="projStart" value="2025-04-01"></div>
      <div class="fg"><label>🔗 Авто-связи</label>
        <select id="autoLinks">
          <option value="yes">Да (последовательные)</option>
          <option value="no">Нет</option>
        </select>
      </div>
      <div class="fg" style="min-width:190px">
        <label>📅 Выходные и праздники</label>
        <label style="display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--rs);cursor:pointer;background:var(--surface);font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text)">
          <input type="checkbox" id="showWeekends" style="width:14px;height:14px;margin:0;padding:0;cursor:pointer;accent-color:var(--accent)">
          Учитывать и показывать
        </label>
      </div>
      <div class="fg" style="max-width:110px"><label>&nbsp;</label>
        <button class="btn btn-ghost" id="todayBtn" style="width:100%">📍 Сегодня</button>
      </div>
    </div>
    <div class="row" id="colSel" style="display:none">
      <div class="fg"><label>📌 Задача</label><select id="colTask"></select></div>
      <div class="fg"><label>👤 Исполнитель</label><select id="colAsgn"></select></div>
      <div class="fg"><label>⏱ Дни</label><select id="colDur"></select></div>
      <div class="fg" style="max-width:110px"><label>&nbsp;</label>
        <button class="btn btn-prime" id="buildBtn" style="width:100%">🚀 Построить</button>
      </div>
    </div>
  </div>
</div>

<div class="sbar">
  <span class="chip cg" id="statusChip">Загрузите CSV или сохранённый проект</span>
  <span class="vsep"></span>
  <span class="chip cb" id="todayChip"></span>
  <span class="vsep" id="legSep" style="display:none"></span>
  <div class="leg" id="legend"></div>
</div>

<div class="stbar" id="stbar">
  <div class="sc"><div class="sc-l">Старт</div><div class="sc-v" id="stS">—</div></div>
  <div class="sc"><div class="sc-l">Финиш</div><div class="sc-v" id="stE">—</div></div>
  <div class="sc"><div class="sc-l">Длительность</div><div class="sc-v acc" id="stD">—</div></div>
  <div class="sc"><div class="sc-l">Задач</div><div class="sc-v" id="stT">—</div></div>
  <div class="sc"><div class="sc-l">Исполнителей</div><div class="sc-v" id="stA">—</div></div>
  <div class="pw">
    <div class="sc-l" style="margin:0">Прогресс</div>
    <div class="pt"><div class="pf" id="pf" style="width:0%"></div></div>
    <div class="pp" id="pp">0%</div>
  </div>
</div>

<div class="gwrap">
  <div id="gantt_here"></div>
  <button class="sidebar-toggle" id="sidebarToggle">◀</button>
</div>

<!-- Add/Edit task modal -->
<div class="ov" id="modal">
  <div class="modal">
    <div class="mtitle" id="mtitle">➕ Добавить задачу</div>
    <div class="mr"><label>Название</label><input type="text" id="mName" placeholder="Название задачи"></div>
    <div class="mr"><label>Исполнитель</label><input type="text" id="mAsgn" placeholder="Имя или роль"></div>
    <div class="mflex">
      <div class="mr"><label>Начало</label><input type="date" id="mS"></div>
      <div class="mr"><label>Длительность (дни)</label><input type="number" id="mDur" min="1" value="5"></div>
    </div>
    <div class="mr">
      <label>Прогресс: <span id="mpv">0</span>%</label>
      <div class="mps"><input type="range" id="mp" min="0" max="100" value="0" step="5"></div>
    </div>
    <div class="mr"><label>Цвет</label>
      <input type="color" id="mc" value="#5b6ef5" style="width:44px;height:30px;padding:2px;cursor:pointer">
    </div>
    <div class="dep-hint">
      💡 Чтобы добавить зависимость — наведите на задачу и перетащите появившуюся точку на другую задачу
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost" id="mCncl">Отмена</button>
      <button class="btn btn-prime" id="mSave">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://cdn.dhtmlx.com/gantt/edge/dhtmlxgantt.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
window.addEventListener('load', function() {

// ── Sanity check ──
if (typeof gantt === 'undefined') {
  document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;flex-direction:column;gap:16px;background:#f0f2f8">
    <div style="font-size:40px">⚠️</div>
    <div style="font-size:18px;font-weight:600;color:#1a2033">Не удалось загрузить библиотеку</div>
    <div style="font-size:13px;color:#4a5578;text-align:center;max-width:400px">
      Файл использует <b>dhtmlxGantt</b> с CDN.<br>
      Откройте файл в браузере с доступом к интернету.<br><br>
      <code style="background:#e2e8f0;padding:2px 6px;border-radius:4px">cdn.dhtmlx.com</code>
    </div>
  </div>`;
  return;
}

const $ = id => document.getElementById(id);
let ganttOk = false, rawData = null, headers = [];
let currentTaskCol='', currentAsgnCol='', currentDurCol='';
let isDark=false, ctrlOn=true, isSidebarCollapsed=false, originalGridWidth=340;
let editingId=null, currentScale='day';

// ── Today chip ──
$('todayChip').textContent = '📅 ' + new Date().toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'});

// ── Helpers ──
function fmtD(d) {
  const dt = new Date(d);
  return [dt.getFullYear(), String(dt.getMonth()+1).padStart(2,'0'), String(dt.getDate()).padStart(2,'0')].join('-');
}
function fmtRu(d) {
  try { return new Date(d).toLocaleDateString('ru',{day:'numeric',month:'short',year:'numeric'}); }
  catch { return ''; }
}
function hsl(str) {
  let h=0; for (let c of String(str)) h=((h<<5)-h)+c.charCodeAt(0),h|=0;
  return `hsl(${Math.abs(h)%360},62%,50%)`;
}
function setStatus(msg, cls='cg') {
  const c=$('statusChip'); c.className='chip '+cls; c.innerHTML=msg;
}

// ── Theme ──
function setTheme(dark) {
  isDark = dark;
  dark ? document.body.setAttribute('data-dark','') : document.body.removeAttribute('data-dark');
  $('themeBtn').textContent = dark ? '☀️' : '🌙';
  if (ganttOk) setTimeout(() => gantt.render(), 30);
}
$('themeBtn').addEventListener('click', () => setTheme(!isDark));

// ── Controls toggle ──
$('ctrlBtn').addEventListener('click', () => {
  ctrlOn = !ctrlOn;
  $('ctrl').style.maxHeight = ctrlOn ? '' : '0';
  if (ganttOk) setTimeout(() => gantt.render(), 260);
});

// ── Scale ──
function applyScale(s) {
  currentScale = s;
  if (typeof gantt === 'undefined') return; // guard: called before gantt loads
  if (s === 'day') {
    gantt.config.scales = [
      {unit:'month', step:1, format:'%F %Y'},
      {unit:'day',   step:1, format:'%d'}
    ];
    gantt.config.min_column_width = 28;
  } else if (s === 'week') {
    gantt.config.scales = [
      {unit:'month', step:1, format:'%F %Y'},
      {unit:'week',  step:1, format:'Нед %W'}
    ];
    gantt.config.min_column_width = 60;
  } else {
    gantt.config.scales = [
      {unit:'year',  step:1, format:'%Y'},
      {unit:'month', step:1, format:'%M'}
    ];
    gantt.config.min_column_width = 70;
  }
  if (ganttOk) gantt.render();
}
document.querySelectorAll('.vtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.vtab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    applyScale(btn.dataset.scale);
  });
});

// ── Init dhtmlxGantt ──
function initGantt() {
  if (ganttOk) return;

  // plugins MUST be called before any config or init
  gantt.plugins({ tooltip: true });

  gantt.config.xml_date      = '%Y-%m-%d';
  gantt.config.drag_move     = true;
  gantt.config.drag_resize   = true;
  gantt.config.drag_links    = true;
  gantt.config.drag_progress = true;
  gantt.config.grid_resize   = true;
  gantt.config.grid_width    = originalGridWidth;
  gantt.config.row_height    = 36;
  gantt.config.bar_height    = 22;
  gantt.config.open_tree_initially = true;
  gantt.config.show_today_marker   = true;

  // ── Fix: unlimited horizontal scroll ──
  // Don't restrict the date range — let it grow with tasks
  gantt.config.start_date = null;
  gantt.config.end_date   = null;
  // Autoscroll while dragging a task near the edge
  gantt.config.autoscroll        = true;
  gantt.config.autoscroll_speed  = 30; // px per tick
  // Allow tasks to be moved beyond the current visible range
  gantt.config.fit_tasks         = true;

  // ── Horizontal scrollbar only under timeline (not under grid) ──
  gantt.config.layout = {
    css: 'gantt_container',
    rows: [
      {
        cols: [
          // Grid — no horizontal scroll, fixed width
          { view: 'grid',      scrollY: 'scrollVer', scrollable: true },
          { resizer: true, width: 1 },
          // Timeline — has its own horizontal scrollbar below
          {
            rows: [
              { view: 'timeline', scrollX: 'scrollHor', scrollable: true, scrollY: 'scrollVer' },
              { view: 'scrollbar', id: 'scrollHor' }
            ]
          },
          { view: 'scrollbar', id: 'scrollVer' }
        ]
      }
    ]
  };

  gantt.templates.tooltip_text = (s, e, task) =>
    `<b>${task.text}</b><br>` +
    (task.assignee ? `👤 ${task.assignee}<br>` : '') +
    `📅 ${fmtRu(s)} → ${fmtRu(e)}<br>` +
    `⏱ ${task.duration} дн · ✅ ${Math.round((task.progress||0)*100)}%`;

  // Columns
  gantt.config.columns = [
    { name:'text',       label:'Задача',       tree:true, width:220, resize:true },
    { name:'assignee',   label:'Исполнитель',  width:110, align:'center', resize:true,
      template: t => {
        const col = hsl(t.assignee||'');
        return t.assignee
          ? `<span style="background:${col}22;color:${col};padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500">${t.assignee}</span>`
          : '';
      }
    },
    { name:'duration',   label:'Дни',          width:50, align:'center', resize:true },
    { name:'start_date', label:'Начало',        width:90, align:'center', resize:true },
  ];

  applyScale(currentScale);
  gantt.init('gantt_here');
  ganttOk = true;

  // Events
  gantt.attachEvent('onAfterTaskUpdate',  updateStats);
  gantt.attachEvent('onAfterTaskAdd',     updateStats);
  gantt.attachEvent('onAfterTaskDelete',  updateStats);
  gantt.attachEvent('onAfterLinkAdd',     updateStats);
  gantt.attachEvent('onAfterLinkDelete',  updateStats);

  // Double-click opens our modal instead of built-in lightbox
  gantt.attachEvent('onTaskDblClick', id => { openEdit(id); return false; });

  $('sidebarToggle').style.display = 'flex';
  $('vtabs').style.display = 'flex';
  $('addTaskBtn').style.display = '';
}

// ── Load data into gantt ──
function loadGantt(tasks, links) {
  initGantt();
  gantt.clearAll();

  // Wide date range so tasks can be dragged freely without hitting the edge
  if (tasks.length) {
    const starts = tasks.map(t => new Date(t.start_date || t.start));
    const minD = new Date(Math.min(...starts));
    const rangeStart = new Date(minD); rangeStart.setMonth(rangeStart.getMonth() - 2);
    // End = 12 months after the project start to give plenty of room
    const rangeEnd = new Date(minD); rangeEnd.setFullYear(rangeEnd.getFullYear() + 2);
    gantt.config.start_date = rangeStart;
    gantt.config.end_date   = rangeEnd;
  }

  gantt.parse({ data: tasks, links: links || [] });
  gantt.render();
  updateStats();
  renderLegend();
}

// ── Stats ──
function updateStats() {
  if (!ganttOk) return;
  const tasks = gantt.getTaskByTime();
  if (!tasks?.length) { $('stbar').style.display='none'; return; }
  let minS=new Date(8640000000000000), maxE=new Date(0), totP=0;
  const asgn=new Set();
  tasks.forEach(t => {
    if (t.start_date < minS) minS=t.start_date;
    if (t.end_date   > maxE) maxE=t.end_date;
    totP += (t.progress||0);
    if (t.assignee) asgn.add(t.assignee);
  });
  const days = Math.ceil((maxE-minS)/86400000);
  const avgP = Math.round(totP/tasks.length*100);
  $('stS').textContent = fmtRu(minS);
  $('stE').textContent = fmtRu(maxE);
  $('stD').textContent = days+' дн';
  $('stT').textContent = tasks.length;
  $('stA').textContent = asgn.size||'—';
  $('pf').style.width  = avgP+'%';
  $('pp').textContent  = avgP+'%';
  $('stbar').style.display='flex';
  renderLegend();
}

// ── Legend ──
function renderLegend() {
  if (!ganttOk) return;
  const tasks = gantt.getTaskByTime();
  const colors={};
  tasks.forEach(t => { if (t.assignee) colors[t.assignee]=t.color||hsl(t.assignee); });
  const leg=$('legend'); leg.innerHTML='';
  $('legSep').style.display=Object.keys(colors).length?'':'none';
  Object.entries(colors).forEach(([n,c])=>{
    const el=document.createElement('div'); el.className='li';
    el.innerHTML=`<span class="ld" style="background:${c}"></span>${n}`;
    leg.appendChild(el);
  });
}

// ── Sidebar ──
$('sidebarToggle').addEventListener('click', () => {
  if (!ganttOk) return;
  if (!isSidebarCollapsed) {
    originalGridWidth=gantt.config.grid_width;
    gantt.config.grid_width=0;
    isSidebarCollapsed=true;
    $('sidebarToggle').textContent='▶';
  } else {
    gantt.config.grid_width=originalGridWidth;
    isSidebarCollapsed=false;
    $('sidebarToggle').textContent='◀';
  }
  gantt.render();
});

// ── Scale tabs ──
$('todayBtn').addEventListener('click', () => {
  if (ganttOk) gantt.showDate(new Date());
});

// ── CSV ──
$('csvFile').addEventListener('change', e => {
  const f=e.target.files[0]; if(!f) return;
  setStatus('⏳ Чтение…','ca');
  Papa.parse(f, {
    header:false, skipEmptyLines:true,
    complete: res => {
      if (res.data.length<2) { setStatus('❌ Мало данных','cr'); return; }
      headers=res.data[0].map(c=>c.trim());
      rawData=res.data.slice(1).map(row=>{
        const o={}; headers.forEach((h,i)=>o[h]=(row[i]||'').trim()); return o;
      }).filter(r=>Object.values(r).some(v=>v));
      if (!rawData.length) { setStatus('❌ Нет данных','cr'); return; }
      ['colTask','colAsgn','colDur'].forEach(id=>{
        $(id).innerHTML=''; headers.forEach(h=>$(id).appendChild(new Option(h,h)));
      });
      $('colTask').value=headers.find(h=>/назва|задач|task|name/i.test(h))||headers[0];
      $('colAsgn').value=headers.find(h=>/испол|assign|ответ|owner/i.test(h))||headers[1]||headers[0];
      $('colDur').value =headers.find(h=>/длит|duration|день|срок/i.test(h))||headers[2]||headers[0];
      $('colSel').style.display='flex';
      setStatus(`✅ ${rawData.length} строк — выберите столбцы и нажмите «Построить»`,'cgr');
    },
    error:()=>setStatus('❌ Ошибка CSV','cr')
  });
});

// ── Workday helpers ──
const RU_HOLIDAYS_ARR = [
  '2024-01-01','2024-01-02','2024-01-03','2024-01-04','2024-01-05',
  '2024-01-06','2024-01-07','2024-01-08','2024-02-23','2024-03-08',
  '2024-04-29','2024-04-30','2024-05-01','2024-05-09','2024-05-10',
  '2024-06-12','2024-11-04','2024-12-30','2024-12-31',
  '2025-01-01','2025-01-02','2025-01-03','2025-01-06','2025-01-07',
  '2025-01-08','2025-02-24','2025-03-10','2025-05-01','2025-05-02',
  '2025-05-08','2025-05-09','2025-06-12','2025-06-13','2025-11-04',
  '2025-12-31',
  '2026-01-01','2026-01-02','2026-01-08','2026-01-09','2026-02-23',
  '2026-03-09','2026-05-01','2026-05-11','2026-06-12','2026-11-04',
];
const RU_HOLIDAYS = new Set(RU_HOLIDAYS_ARR);
function isWorkday(d) {
  const dow = d.getDay();
  if (dow === 0 || dow === 6) return false;
  const key = fmtD(d);
  return !RU_HOLIDAYS.has(key);
}
function nextWorkday(d) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  while (!isWorkday(r)) r.setDate(r.getDate()+1);
  return r;
}
function addWorkdays(d, n) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  let added = 0;
  while (added < n) {
    r.setDate(r.getDate()+1);
    if (isWorkday(r)) added++;
  }
  return r;
}

$('buildBtn').addEventListener('click', () => {
  if (!rawData) { setStatus('❌ Загрузите CSV','cr'); return; }
  currentTaskCol=$('colTask').value; currentAsgnCol=$('colAsgn').value; currentDurCol=$('colDur').value;
  const valid=rawData.filter(r=>{ const d=parseFloat(r[currentDurCol]); return r[currentTaskCol]&&r[currentAsgnCol]&&!isNaN(d)&&d>0; });
  if (!valid.length) { setStatus('❌ Нет задач с длительностью > 0','cr'); return; }

  const ps=$('projStart').value;
  const [py,pm,pd]=ps.split('-').map(Number);
  let base=new Date(py,pm-1,pd,0,0,0); if(isNaN(base)) base=new Date();

  const groups=new Map();
  valid.forEach((r,i)=>{ const a=r[currentAsgnCol]; if(!groups.has(a)) groups.set(a,[]); groups.get(a).push({...r,_i:i}); });

  const auto=$('autoLinks').value==='yes';
  const showWeekends = $('showWeekends').checked; // checked = show & account for them
  const tasksArr=[], linksArr=[]; let tid=1, lid=1;

  for (const [asgn, rows] of groups) {
    let cur=new Date(base), prev=null;
    for (const r of rows.sort((a,b)=>a._i-b._i)) {
      const dur=Math.ceil(parseFloat(r[currentDurCol]));
      // If showing weekends: skip non-working days when placing start
      if (showWeekends) cur = nextWorkday(cur);
      const start=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());
      const id='t'+tid++;
      tasksArr.push({
        id, text:r[currentTaskCol], assignee:asgn,
        start_date:fmtD(start), duration:dur,
        progress:0, open:true, color:hsl(asgn)
      });
      if (auto && prev) linksArr.push({id:'l'+lid++, source:prev, target:id, type:'0'});
      prev=id;
      if (auto) {
        cur = showWeekends
          ? addWorkdays(start, dur)   // advance by working days only
          : new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()+dur);
      }
    }
  }

  // Configure gantt working time
  if (showWeekends) {
    // Work only Mon–Fri, skip Sat/Sun
    gantt.setWorkTime({ day: 0, hours: false });
    gantt.setWorkTime({ day: 6, hours: false });
    RU_HOLIDAYS_ARR.forEach(d => gantt.setWorkTime({ date: new Date(d+'T00:00:00'), hours: false }));
    gantt.config.work_time    = true;
    gantt.config.skip_off_time = false; // keep columns visible — we colour them ourselves
    // Column cell CSS class for subtle tinting
    gantt.templates.timeline_cell_class = (task, date) => {
      const key = fmtD(date);
      if (RU_HOLIDAYS.has(key))           return 'gantt-holiday-col';
      const dow = date.getDay();
      if (dow === 0 || dow === 6)         return 'gantt-weekend-col';
      return '';
    };
    // Also colour the scale cells (header)
    gantt.templates.scale_cell_class = date => {
      const key = fmtD(date);
      if (RU_HOLIDAYS.has(key))           return 'gantt-holiday-col';
      const dow = date.getDay();
      if (dow === 0 || dow === 6)         return 'gantt-weekend-col';
      return '';
    };
  } else {
    // No weekends awareness: hide off-time columns, no colouring
    gantt.config.work_time     = false;
    gantt.config.skip_off_time = false;
    gantt.templates.timeline_cell_class = () => '';
    gantt.templates.scale_cell_class    = () => '';
  }

  loadGantt(tasksArr, linksArr);
  setStatus(`✅ ${tasksArr.length} задач построено`+(showWeekends?' · учёт рабочих дней':''),'cgr');
});

// ── Modal ──
function openAdd() {
  editingId=null; $('mtitle').textContent='➕ Добавить задачу';
  $('mName').value=''; $('mAsgn').value='';
  $('mS').value=fmtD(new Date()); $('mDur').value=5;
  $('mp').value=0; $('mpv').textContent='0'; $('mc').value='#5b6ef5';
  $('modal').classList.add('open'); setTimeout(()=>$('mName').focus(),80);
}
function openEdit(id) {
  const t=gantt.getTask(id); if(!t) return;
  editingId=id; $('mtitle').textContent='✏️ Редактировать задачу';
  $('mName').value=t.text||''; $('mAsgn').value=t.assignee||'';
  $('mS').value=fmtD(t.start_date); $('mDur').value=t.duration||1;
  const p=Math.round((t.progress||0)*100); $('mp').value=p; $('mpv').textContent=p;
  $('mc').value=t.color||'#5b6ef5';
  $('modal').classList.add('open');
}
function closeModal() { $('modal').classList.remove('open'); }

$('mp').addEventListener('input', e=>$('mpv').textContent=e.target.value);
$('addTaskBtn').addEventListener('click', openAdd);
$('mCncl').addEventListener('click', closeModal);
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });

$('mSave').addEventListener('click', () => {
  const name=$('mName').value.trim(), asgn=$('mAsgn').value.trim();
  const s=$('mS').value, dur=parseInt($('mDur').value);
  const prog=parseInt($('mp').value)/100, col=$('mc').value;
  if(!name||!s||!dur) { alert('Заполните название, дату и длительность'); return; }

  if (editingId!==null) {
    const t=gantt.getTask(editingId);
    t.text=name; t.assignee=asgn; t.start_date=new Date(s+'T00:00:00');
    t.duration=dur; t.progress=prog; t.color=col;
    gantt.updateTask(editingId);
  } else {
    if (!ganttOk) { initGantt(); gantt.parse({data:[],links:[]}); }
    const newId='m'+Date.now();
    gantt.addTask({ id:newId, text:name, assignee:asgn, start_date:s, duration:dur, progress:prog, color:col, open:true });
  }
  updateStats();
  closeModal();
});

// ── Save / Load ──
$('saveBtn').addEventListener('click', () => {
  if (!ganttOk) { setStatus('❌ Сначала постройте диаграмму','cr'); return; }
  const cfg={
    v:'5.0', isDark, scale:currentScale,
    projStart:$('projStart').value, autoLinks:$('autoLinks').value,
    skipWeekends: $('showWeekends').checked,
    taskCol:currentTaskCol, asgnCol:currentAsgnCol, durCol:currentDurCol,
    headers, csvData:rawData,
    tasks: gantt.getTaskByTime().map(t=>({
      id:t.id, text:t.text, assignee:t.assignee||'',
      start_date:fmtD(t.start_date), duration:t.duration,
      progress:t.progress||0, color:t.color||'', open:true
    })),
    links: gantt.getLinks()
  };
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg)],{type:'application/json'}));
  a.download=`project_${fmtD(new Date())}.gantt`; a.click();
  URL.revokeObjectURL(a.href);
  setStatus('✅ Сохранено','cgr');
});

$('loadBtn').addEventListener('click',()=>$('loadFile').click());
$('loadFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const rd=new FileReader();
  rd.onload=ev=>{
    try {
      const cfg=JSON.parse(ev.target.result);
      if (cfg.isDark!==undefined) setTheme(cfg.isDark);
      if (cfg.scale) {
        currentScale=cfg.scale;
        document.querySelectorAll('.vtab').forEach(b=>b.classList.toggle('on',b.dataset.scale===currentScale));
      }
      if (cfg.projStart) $('projStart').value=cfg.projStart;
      if (cfg.autoLinks) $('autoLinks').value=cfg.autoLinks;
      if (cfg.skipWeekends !== undefined) $('showWeekends').checked = cfg.skipWeekends;
      headers=cfg.headers||[]; rawData=cfg.csvData||null;
      currentTaskCol=cfg.taskCol||''; currentAsgnCol=cfg.asgnCol||''; currentDurCol=cfg.durCol||'';
      if (headers.length) {
        ['colTask','colAsgn','colDur'].forEach(id=>{
          $(id).innerHTML=''; headers.forEach(h=>$(id).appendChild(new Option(h,h)));
        });
        $('colTask').value=currentTaskCol; $('colAsgn').value=currentAsgnCol; $('colDur').value=currentDurCol;
        $('colSel').style.display='flex';
      }
      if (!cfg.tasks?.length) { setStatus('❌ Нет задач','cr'); return; }
      loadGantt(cfg.tasks, cfg.links||[]);
      setStatus(`📂 Загружено ${cfg.tasks.length} задач`,'cb');
    } catch(err) { setStatus('❌ '+err.message,'cr'); console.error(err); }
  };
  rd.readAsText(f);
});

// ── Fullscreen ──
$('fsBtn').addEventListener('click',()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); });
document.addEventListener('fullscreenchange',()=>{
  $('fsBtn').innerHTML=document.fullscreenElement?'🚪 <span>Выйти</span>':'🖥️ <span>Экран</span>';
  if(ganttOk) setTimeout(()=>gantt.render(),50);
});
